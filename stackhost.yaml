zerops:
  - setup: nodejsargo
    build:
      base: nodejs@22
      buildCommands:
        - npm install
      deployFiles:
        - index.js
        - index.html
        - package.json
        - package-lock.json
        - node_modules
      cache:
        - node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: node index.js
